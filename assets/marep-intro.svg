<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MAREP — Matej Repka</title>
  <desc id="desc">An ASCII MAREP wordmark on a dark navy and crimson background. Designer and developer, Bratislava, Slovakia. From an idea to something useful.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08080a"/>
      <stop offset=".7" stop-color="#0e1424"/>
      <stop offset="1" stop-color="#21101b"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop stop-color="#0f3173" stop-opacity=".8"/>
      <stop offset="1" stop-color="#0f3173" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimson">
      <stop stop-color="#52122a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#52122a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="48" y1="110" x2="690" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fafafa"/>
      <stop offset="1" stop-color="#89a6df"/>
    </linearGradient>
    <linearGradient id="rule" x1="48" y1="0" x2="1152" y2="0" gradientUnits="userSpaceOnUse">
